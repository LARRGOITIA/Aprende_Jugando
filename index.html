<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Jugando v15</title>
    <link rel="stylesheet" href="styles-v15.css">
    <script defer src="app-v15.js"></script>
</head>
<body>
    <div class="sky-layer" aria-hidden="true">
        <span class="cloud cloud-one"></span>
        <span class="cloud cloud-two"></span>
        <span class="cloud cloud-three"></span>
    </div>

    <div class="animal-wall" aria-hidden="true">
        <span class="wall-animal wall-animal-one">🐯</span>
        <span class="wall-animal wall-animal-two">🐼</span>
        <span class="wall-animal wall-animal-three">🦁</span>
        <span class="wall-animal wall-animal-four">🐰</span>
        <span class="wall-animal wall-animal-five">🦆</span>
        <span class="wall-animal wall-animal-six">🐟</span>
    </div>

    <header class="top-banner">
        <div class="brand-block">
            <p class="eyebrow">Version 15</p>
            <h1><span class="float-word a">Animales</span> <span class="float-word b"></span> <span class="float-word c"></span> <span class="float-word d"></span> <span class="float-word e"></span></h1>
            <p class="subtitle">Colores, numeros y juegos.</p>
        </div>

        <div class="status-board" aria-label="Marcador general">
            <div class="status-pill">
                <span>Puntos</span>
                <strong id="score-value">0</strong>
            </div>
            <div class="status-pill soft">
                <span>Estrellas</span>
                <strong id="star-value">0</strong>
            </div>
            <button class="options-button" type="button" id="options-toggle" aria-expanded="false" aria-controls="options-dock" aria-label="Opciones">
                <span>☰</span>
            </button>
            <div class="status-pill bright" id="live-message">Listo</div>
        </div>
    </header>

    <section class="options-dock" id="options-dock" aria-label="Opciones rapidas" hidden>
        <button class="dock-chip" type="button" data-panel="panel-animales">🐾</button>
        <button class="dock-chip" type="button" data-panel="panel-colores">🎨</button>
        <button class="dock-chip" type="button" data-panel="panel-numeros">🔢</button>
        <button class="dock-chip" type="button" data-panel="panel-formas">🔺</button>
        <button class="dock-chip" type="button" data-panel="panel-sonidos">🔊</button>
    </section>

    <main class="page-shell">
        <section class="hero-panel">
            <div class="hero-copy">
                <p class="section-tag">Peques</p>
                <h2>Grande y lindo</h2>
                <p class="hero-emoji-line">🐯 🐼 🦁 🐰 🦆 🐟</p>
                <div class="hero-actions">
                    <button class="cta-button" type="button" data-panel="panel-animales">Animales</button>
                    <button class="cta-button alt" type="button" data-panel="panel-colores">Colores</button>
                    <button class="cta-button alt" type="button" data-panel="panel-numeros">Numeros</button>
                </div>
            </div>

            <aside class="mascot-card">
                <div class="mascot-face mascot-bounce" aria-hidden="true">🐻</div>
                <h3 id="focus-title">Hola</h3>
                <p id="focus-text">Toca una figura.</p>
            </aside>
        </section>

        <nav class="game-menu" aria-label="Minijuegos disponibles">
            <button class="game-tab active" type="button" data-panel="panel-animales">Animales</button>
            <button class="game-tab" type="button" data-panel="panel-colores">Colores</button>
            <button class="game-tab" type="button" data-panel="panel-numeros">Numeros</button>
            <button class="game-tab" type="button" data-panel="panel-formas">Formas</button>
            <button class="game-tab" type="button" data-panel="panel-sonidos">Sonidos</button>
            <button class="game-tab" type="button" data-panel="panel-quiz">Juego</button>
        </nav>

        <section class="game-panel active" id="panel-animales">
            <div class="panel-head compact">
                <div>
                    <p class="section-tag">Animales</p>
                </div>
                <p class="panel-note" id="animal-note">Toca uno.</p>
            </div>
            <div class="animal-grid big-grid" id="animal-grid">
                <button class="animal-card tiger float-pop" type="button" data-name="Tigre" data-message="Rugido fuerte">🐯</button>
                <button class="animal-card panda float-pop" type="button" data-name="Panda" data-message="Abrazo suave">🐼</button>
                <button class="animal-card bunny float-pop" type="button" data-name="Conejo" data-message="Saltos rapidos">🐰</button>
                <button class="animal-card duck float-pop" type="button" data-name="Pato" data-message="Cua cua">🦆</button>
                <button class="animal-card lion float-pop" type="button" data-name="Leon" data-message="Ruge fuerte">🦁</button>
                <button class="animal-card fish float-pop" type="button" data-name="Pez" data-message="Nada rapido">🐟</button>
            </div>
        </section>

        <section class="game-panel" id="panel-colores">
            <div class="panel-head compact">
                <div><p class="section-tag">Colores</p></div>
                <p class="panel-note" id="color-note">Toca uno.</p>
            </div>
            <div class="animal-grid big-grid" id="color-grid">
                <button class="animal-card tiger color-card warm float-pop" type="button" data-name="Rojo">🔴</button>
                <button class="animal-card duck color-card sun float-pop" type="button" data-name="Amarillo">🟡</button>
                <button class="animal-card panda color-card cool float-pop" type="button" data-name="Azul">🔵</button>
                <button class="animal-card bunny color-card fresh float-pop" type="button" data-name="Verde">🟢</button>
            </div>
        </section>

        <section class="game-panel" id="panel-numeros">
            <div class="panel-head compact">
                <div><p class="section-tag">Numeros</p></div>
                <button class="small-button" type="button" id="new-number-round">✨</button>
            </div>
            <div class="number-stage">
                <div class="target-bubble">
                    <span>Busca</span>
                    <strong id="target-number">?</strong>
                </div>
                <p class="panel-note" id="number-note">Toca igual.</p>
                <div class="number-grid" id="number-grid">
                    <button class="number-button" type="button" data-number="1">1</button>
                    <button class="number-button" type="button" data-number="2">2</button>
                    <button class="number-button" type="button" data-number="3">3</button>
                    <button class="number-button" type="button" data-number="4">4</button>
                    <button class="number-button" type="button" data-number="5">5</button>
                    <button class="number-button" type="button" data-number="6">6</button>
                    <button class="number-button" type="button" data-number="7">7</button>
                    <button class="number-button" type="button" data-number="8">8</button>
                    <button class="number-button" type="button" data-number="9">9</button>
                    <button class="number-button" type="button" data-number="10">10</button>
                </div>
            </div>
        </section>

        <section class="game-panel" id="panel-formas">
            <div class="panel-head compact">
                <div><p class="section-tag">Formas</p></div>
                <p class="panel-note" id="shape-note">Toca.</p>
            </div>
            <div class="animal-grid big-grid" id="shape-grid">
                <button class="animal-card shape-card circle float-pop" type="button" data-shape="Circulo">⚪</button>
                <button class="animal-card shape-card square float-pop" type="button" data-shape="Cuadrado">🟦</button>
                <button class="animal-card shape-card triangle float-pop" type="button" data-shape="Triangulo">🔺</button>
                <button class="animal-card shape-card star float-pop" type="button" data-shape="Estrella">⭐</button>
            </div>
        </section>

        <section class="game-panel" id="panel-sonidos">
            <div class="panel-head compact">
                <div><p class="section-tag">Sonidos</p></div>
                <p class="panel-note" id="sound-note">Toca.</p>
            </div>
            <div class="animal-grid big-grid" id="sound-grid">
                <button class="animal-card sound-card float-pop" type="button" data-sound="Miau">🐱</button>
                <button class="animal-card sound-card float-pop" type="button" data-sound="Guau">🐶</button>
                <button class="animal-card sound-card float-pop" type="button" data-sound="Cua">🦆</button>
                <button class="animal-card sound-card float-pop" type="button" data-sound="Muu">🐮</button>
            </div>
        </section>

        <section class="game-panel" id="panel-quiz">
            <div class="panel-head compact">
                <div><p class="section-tag">Juego</p></div>
                <button class="small-button" type="button" id="next-quiz">↻</button>
            </div>
            <div class="quiz-box">
                <p class="quiz-question" id="quiz-question"></p>
                <div class="quiz-options" id="quiz-options" role="group" aria-label="Opciones del quiz"></div>
                <p class="panel-note" id="quiz-feedback"></p>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p>Animales.</p>
    </footer>
</body>
</html>
